<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rail Sound Atlas | Train Sounds from Around the World</title>
    <meta name="description" content="An interactive atlas of metro and train sounds from transit systems worldwide, including door chimes, station announcements, and departure melodies.">
    <!-- Embed -->
    <meta content="Rail Sound Atlas" property="og:title" />
    <meta content="An interactive atlas for sounds of rail systems across the world!" property="og:description" />
    <meta content="https://railsoundatlas.org" property="og:url" />
    <meta content="https://mvsfcsodvtojqrmvsjbi.supabase.co/storage/v1/object/public/images/canada/skytrain/expo.png" property="og:image" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://mvsfcsodvtojqrmvsjbi.supabase.co/storage/v1/object/public/images/canada/skytrain/expo.png" />
    
    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand-link" href="/">Rail Sound Atlas</a>
      <div class="header-right">
        <nav class="breadcrumb" aria-label="location">
          <button class="crumb is-active" type="button" data-view="home" id="crumb-home">Home</button>
          <span class="crumb-sep is-hidden" data-sep="country">/</span>
          <button class="crumb is-hidden" type="button" data-view="country" id="crumb-country"></button>
          <span class="crumb-sep is-hidden" data-sep="system">/</span>
          <button class="crumb is-hidden" type="button" data-view="system" id="crumb-system"></button>
        </nav>
        <div class="history-toggle" id="history-toggle" hidden>
          <button type="button" class="history-button is-active" id="history-active">Active</button>
          <button type="button" class="history-button" id="history-historical">Historical</button>
        </div>
        <a class="contribute-link" href="/contribute" aria-label="Contribute">Contribute</a>
        <button type="button" class="header-button about-button" id="about-button" aria-label="About Rail Sound Atlas">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M12 10.5v6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            <circle cx="12" cy="7.5" r="1" fill="currentColor" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="view is-active" id="view-home">
        <div class="menu-skeleton" id="home-loading" role="status" aria-label="Loading countries" hidden></div>
        <div class="card-grid" id="country-grid"></div>
      </section>

      <section class="view" id="view-country">
        <div class="menu-skeleton" id="country-loading" role="status" aria-label="Loading systems" hidden></div>
        <div id="system-grid"></div>
      </section>

      <section class="view" id="view-system">
        <section class="system-content system-skeleton" id="system-loading" role="status" aria-label="Loading system" hidden></section>
        <section class="system-content" id="system-content"></section>
      </section>
    </main>
    <button class="surprise-button" id="surprise-button" type="button" aria-label="Go to a random system and play a random sound" title="Surprise Me!">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm2.5 3A1.5 1.5 0 1 0 7.5 9a1.5 1.5 0 0 0 0-3Zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM12 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM7.5 15a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" />
      </svg>
    </button>
    <div class="info-modal" id="modal" hidden>
      <div class="info-modal-backdrop" id="modal-backdrop"></div>
      <div class="info-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="info-modal-head">
          <h3 id="modal-title"></h3>
          <div class="info-modal-actions">
            <a id="modal-action" class="modal-button" hidden></a>
            <button id="modal-share" type="button" class="modal-button" aria-label="Copy sound link" title="Copy sound link" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12ZM8 13h8v-2H8v2Zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10Z"/></svg>
            </button>
            <button type="button" class="modal-button" id="modal-close" aria-label="Close">✕</button>
          </div>
        </div>
        <div class="info-modal-body" id="modal-body"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="src/scripts/index.js" type="module"></script>
  </body>
</html>
